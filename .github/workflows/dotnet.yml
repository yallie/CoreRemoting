name: .NET

on:
  push:
#    branches:
#    - master
#    - release/*
  pull_request:
    branches:
    - master
    - release/*
    - issue*
    - auth-refactor

jobs:
  build:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        exclude:
          - os: ${{ !contains(github.event.head_commit.message, 'windows') && !github.event.pull_request && 'windows-latest' }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - name: Checkout source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: | 
          8.0.x
          9.0.x

    - name: Install libmsquic (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libmsquic
        ldconfig -p | grep libmsquic || echo "libmsquic not found in ldconfig"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload TRX
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trx-${{ matrix.os }}
        path: '**/TestResults/test-results.trx'
        if-no-files-found: ignore

  badge:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: trx-*
        path: trx
    - shell: bash
      env:
        PANTRY_ID: ${{ secrets.PANTRY_ID }}
      run: |
        P=0; F=0
        for f in $(find trx -name '*.trx'); do
          P=$((P + $(grep -oP 'passed="\K[0-9]+' "$f" | head -n1)))
          F=$((F + $(grep -oP 'failed="\K[0-9]+' "$f" | head -n1)))
        done
        T=$((P + F))
        [ "$F" -eq 0 ] && C=brightgreen || C=critical
        curl -sS -X POST "https://getpantry.cloud/apiv1/pantry/$PANTRY_ID/basket/core-remoting-test-counters" \
          -H "Content-Type: application/json" \
          -d "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"$P/$T passed\",\"color\":\"$C\"}"
